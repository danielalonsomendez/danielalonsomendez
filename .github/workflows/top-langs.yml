name: Update Top Languages SVG

on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

jobs:
  generate-top-langs:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: 3.x

      - name: Install dependencies
        run: pip install requests matplotlib

      - name: Generate Top Languages SVG
        env:
          ORG_NAME: "yousuite"
          GITHUB_USERNAME: "danielalonsomendez"
          PAT: ${{ secrets.PERSONAL_PAT }}
        run: |
          python .github/scripts/generate_top_languages_svg.py

      - name: Commit & Push SVG
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git add TOP_LANGUAGES.svg
          git commit -m "Update Top Languages SVG" || echo "No changes"
          git push https://${{ secrets.PERSONAL_PAT }}@github.com/${{ github.repository }} HEAD:main
